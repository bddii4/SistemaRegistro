<!DOCTYPE html>
<!-- Plantilla base: Bootstrap 5, CSS principal, notificaciones.js, bloques para body/extra_js -->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sistema de monitoreo{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/css/main.css" rel="stylesheet">
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999">
  {% for msg in messages %}
  <div class="toast align-items-center text-bg-{{ msg.tags }} border-0 show" role="alert">
    <div class="d-flex">
      <div class="toast-body fw-semibold">{{ msg }}</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
  {% endfor %}
</div>
{% endif %}

{% block body %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/notificaciones.js"></script>
<script>
  // Auto-dismiss toasts
  document.querySelectorAll('.toast').forEach(t => {
    setTimeout(() => new bootstrap.Toast(t, {delay:4000}).hide(), 300);
  });
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
